<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aster & Row Support</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f5f5f5;
            color: #1f1f1f;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: min(900px, 95vw);
            height: min(850px, 94vh);

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.10);

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        .header {
            padding: 20px 24px;

            border-bottom: 1px solid #e8e8e8;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;

            border-radius: 12px;

            background: #111;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 18px;
        }

        .title {
            font-size: 17px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 12px;
            color: #777;
            margin-top: 2px;
        }

        .status {
            font-size: 12px;
            color: #238636;

            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            background: #2da44e;

            border-radius: 50%;
        }

        .messages {
            flex: 1;

            overflow-y: auto;

            padding: 28px;

            display: flex;
            flex-direction: column;

            gap: 18px;
        }

        .welcome {
            margin: auto;

            text-align: center;

            max-width: 560px;
        }

        .welcome h1 {
            margin-bottom: 8px;

            font-size: 28px;
        }

        .welcome p {
            color: #777;

            line-height: 1.5;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 8px;

            margin-top: 20px;
        }

        .suggestion {
            border: 1px solid #ddd;

            background: white;

            border-radius: 20px;

            padding: 9px 14px;

            cursor: pointer;

            font-size: 13px;
        }

        .suggestion:hover {
            background: #f5f5f5;
        }

        .message {
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;

            padding: 13px 16px;

            border-radius: 16px;

            line-height: 1.55;

            white-space: pre-wrap;
        }

        .assistant .bubble {
            background: #f1f1f1;

            border-bottom-left-radius: 5px;
        }

        .user .bubble {
            background: #111;
            color: white;

            border-bottom-right-radius: 5px;
        }

        .meta {
            margin-top: 7px;

            font-size: 11px;

            color: #777;
        }

        .input-area {
            border-top: 1px solid #e8e8e8;

            padding: 16px;
        }

        .input-box {
            display: flex;

            gap: 10px;

            background: #f5f5f5;

            border: 1px solid #ddd;

            border-radius: 14px;

            padding: 8px;
        }

        textarea {
            flex: 1;

            border: none;

            background: transparent;

            resize: none;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            padding: 9px;

            min-height: 42px;

            max-height: 120px;
        }

        button.send {
            width: 44px;
            height: 44px;

            border: none;

            border-radius: 10px;

            background: #111;

            color: white;

            cursor: pointer;

            font-size: 18px;
        }

        button.send:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .footer {
            text-align: center;

            font-size: 10px;

            color: #999;

            margin-top: 7px;
        }

        .typing {
            color: #777;

            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>
                <div class="title">
                    Aster & Row Support
                </div>

                <div class="subtitle">
                    AI Customer Support Agent
                </div>
            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            Online

        </div>

    </div>


    <div class="messages" id="messages">

        <div class="welcome" id="welcome">

            <h1>
                How can we help?
            </h1>

            <p>
                Ask about returns, shipping, warranties,
                or your order.
            </p>

            <div class="suggestions">

                <button
                    class="suggestion"
                    onclick="useSuggestion('What is your return policy?')"
                >
                    Return policy
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Where is my order ORD-1007?')"
                >
                    Track an order
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Do you ship to Canada?')"
                >
                    Canada shipping
                </button>

                <button
                    class="suggestion"
                    onclick="useSuggestion('Is the Breeze Tumbler dishwasher safe?')"
                >
                    Product question
                </button>

            </div>

        </div>

    </div>


    <div class="input-area">

        <div class="input-box">

            <textarea
                id="input"
                placeholder="Message Aster & Row..."
                rows="1"
            ></textarea>

            <button
                class="send"
                id="send"
                onclick="sendMessage()"
            >
                ↑
            </button>

        </div>

        
    </div>

</div>


<script>

const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");


function useSuggestion(text) {

    input.value = text;

    sendMessage();

}


function addMessage(text, type, trace = null) {

    if (welcome) {
        welcome.remove();
    }

    const wrapper = document.createElement("div");

    wrapper.className =
        "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);

    if (trace && trace.handoff) {

        const meta = document.createElement("div");

        meta.className = "meta";

        meta.textContent =
            "Human support recommended";

        bubble.appendChild(meta);

    }

    messages.scrollTop =
        messages.scrollHeight;

}


async function sendMessage() {

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    addMessage(
        message,
        "user"
    );

    input.value = "";

    send.disabled = true;

    const typing = document.createElement("div");

    typing.className =
        "message assistant";

    typing.innerHTML =
        '<div class="bubble typing">Thinking...</div>';

    messages.appendChild(typing);

    messages.scrollTop =
        messages.scrollHeight;

    try {

        const response =
            await fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            });


        const data =
            await response.json();


        typing.remove();


        if (!response.ok) {

            addMessage(
                "Something went wrong: " +
                (data.error || "Unknown error"),
                "assistant"
            );

        } else {

            addMessage(
                data.response,
                "assistant",
                data.trace
            );

        }

    } catch (error) {

        typing.remove();

        addMessage(
            "I couldn't connect to the agent. " +
            "Make sure the Python server is running.",
            "assistant"
        );

    }


    send.disabled = false;

    input.focus();

}


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>
</html>
